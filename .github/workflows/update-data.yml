name: Update issue data

on:
  schedule:
    - cron: '23 4 * * *'  # daily at 04:23 UTC (every 24h)
  workflow_dispatch:      # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_issues.py

      - name: Commit and push if data changed
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ -n "$(git status --porcelain -- data)" ]; then
            count=$(python3 -c 'import json; print(json.load(open("data/issues.json"))["count"])')
            git commit -m "data: refresh $(date -u +%F) (${count} open issues)"
            git push
          else
            echo "No data changes - nothing to commit."
          fi